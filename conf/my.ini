[client]
port = 3307
socket = mysql.sock
default-character-set = utf8mb4

[mysqld]
port = 3307
bind-address = 127.0.0.1
socket = mysql.sock
basedir = "D:/LabIA/aetherstack/bin/mariadb"
datadir = "D:/LabIA/aetherstack/data/mariadb"
pid-file = "D:/LabIA/aetherstack/data/mariadb/mysql.pid"
log-error = "D:/LabIA/aetherstack/logs/mariadb_error.log"

character-set-server = utf8mb4
collation-server = utf8mb4_unicode_ci

default_storage_engine = InnoDB
max_connections = 100
max_allowed_packet = 64M
innodb_buffer_pool_size = 128M
innodb_file_per_table = 1
