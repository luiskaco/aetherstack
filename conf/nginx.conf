# AetherStack - Nginx Master Configuration
worker_processes  auto;

error_log  "D:/LabIA/aetherstack/logs/nginx_error.log" warn;
pid        "D:/LabIA/aetherstack/logs/nginx.pid";

events {
    worker_connections  1024;
}

http {
    include       "D:/LabIA/aetherstack/bin/nginx/conf/mime.types";
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  "D:/LabIA/aetherstack/logs/nginx_access.log"  main;

    sendfile        on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    client_max_body_size 128M;

    gzip  on;
    gzip_disable "msie6";
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Upstream PHP FastCGI
    upstream php_cgi {
        server 127.0.0.1:9000;
        keepalive 16;
    }

    # Servidor por defecto (Dashboard y proyectos en D:\LabIA)
    server {
        listen       80;
        server_name  localhost;

        root   "D:/LabIA";
        index  index.php index.html index.htm;

        location / {
            autoindex on;
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Procesar PHP
        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass   php_cgi;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
            include        "D:/LabIA/aetherstack/bin/nginx/conf/fastcgi_params";
            fastcgi_read_timeout 300;
        }

        # Protección archivos ocultos (.env, .git)
        location ~ /\. {
            deny all;
        }
    }

    # Incluir Virtual Hosts
    include "D:/LabIA/aetherstack/conf/vhosts/*.conf";
}
